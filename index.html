<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أبطال الكسور</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#fff5db;color:#164e63}header,footer{background:#164e63;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}main{min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px}h1{font-size:clamp(32px,5vw,72px);margin:0}h2{font-size:clamp(24px,3vw,45px);margin:0}p{font-size:clamp(17px,2vw,26px);max-width:850px;line-height:1.8;margin:0}button,select,input{font:inherit;padding:12px 20px;border:2px solid #a5c9c4;border-radius:14px;background:white;color:#164e63}button{cursor:pointer;font-weight:bold;box-shadow:0 4px #164e6320}button:hover{background:#ffda80}button:disabled{opacity:.6;cursor:default}.primary{background:#16866e;color:white}.eq{direction:ltr;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:clamp(25px,4vw,52px);font-weight:bold}.f{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center}.f span:first-child{border-bottom:3px solid;padding:3px 8px}.f span:last-child{padding:3px 8px}.m{display:inline-flex;align-items:center;gap:5px}.card{background:#fffdf7;border:2px solid #d5e5d9;border-radius:22px;padding:20px;max-width:900px;width:100%;box-shadow:0 5px #164e6310}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(850px,100%)}.tile{padding:20px;border-radius:18px;font-size:22px;line-height:1.7}.good{background:#d6f7d7!important;color:#176739}.bad{background:#ffe1d9!important;color:#9d3025}.art{font-size:85px}.tag{background:#fff;padding:7px 18px;border-radius:30px}.progress{height:7px;background:#e5e7eb}.progress div{height:100%;background:#f5b942}canvas{background:white;border:2px dashed #16866e;border-radius:15px const $=id=>document.getElementById(id),s=$('s');let page=0,answers={},parts=Array(8).fill(false),order=[],wins={},reveal=0,mode=false,team=0,points=[0,0],sound=false,seconds=60,interval=null,student='',wheel=-1,opened=false;const f=(a,b)=>`<span class="f"><span>${a}</span><span>${b}</span></span>`,m=(n,a,b)=>`<span class="m">${n}${f(a,b)}</span>`,eq=x=>`<div class="eq">${x}</div>`,card=x=>`<div class="card">${x}</div>`,btn=(t,c)=>`<button onclick="${c.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${t}</button>`,tile=(t,c)=>`<div class="tile" style="background:${c}">${t}</div>`;const titles=['بداية المغامرة','خريطة الكنز','أهداف التعلم','اكتشاف الكسور','مراجعة الكسور','لعبة البيتزا','التحويل','تحدي التحويل','خطوات الضرب','ترتيب الخطوات','مثال محلول','الاختصار','تدريب فردي','الضرب في عدد صحيح','الأخطاء الشائعة','مطبخ الكسور','حديقة الكسور','سبورة الحل','صح أم خطأ','عجلة الحظ','مسابقة الفرق','تحدي الكنز الأول','تحدي الكنز الأخير','صندوق الكنز','شهادة الإنجاز'];const Q={4:['اضرب الكسرين',f(1,2)+' × '+f(2,3),1,3,[f(1,3),f(3,5),f(2,5),f(1,6)],0,'اضرب البسطين والمقامين','2/6 = 1/3'],7:['حوّل العدد الكسري',m(3,1,4),13,4,[f(7,4),f(12,4),f(13,4),f(4,13)],2,'اضرب 3 في 4 وأضف 1','3 × 4 + 1 = 13'],12:['احسب الناتج',m(2,1,4)+' × '+m(1,1,3),3,1,null,0,'حوّل إلى 9/4 و4/3','9/4 × 4/3 = 3'],13:['اضرب', '3 × '+m(1,1,2),9,2,['3',m(4,1,2),'5',m(3,1,2)],1,'حوّل واحدًا ونصف إلى 3/2','9/2 = 4½'],15:['كم كوب طحين نحتاج لوصفتين ونصف إذا كانت الوصفة تحتاج كوبًا ونصف؟',m(1,1,2)+' × '+m(2,1,2),15,4,[m(3,3,4),'4',m(2,1,4),'5'],0,'حوّل إلى 3/2 و5/2','15/4 = 3¾'],16:['حديقة طولها ثلاثة أمتار ونصف وعرضها متران ونصف. احسب المساحة.',m(3,1,2)+' × '+m(2,1,2),35,4,null,0,'المساحة = الطول × العرض','35/4 = 8¾'],18:['هل العبارة صحيحة؟',m(1,1,2)+' × '+m(2,1,2)+' = '+m(2,1,4),0,1,['صحيح','خطأ'],1,'حوّل العددين أولًا','الناتج الصحيح 3¾'],21:['تحدي الكنز',m(2,1,3)+' × '+m(1,1,2),7,2,[m(2,1,2),'3','5',m(3,1,2)],3,'حوّل إلى 7/3 و3/2','7/2 = 3½'],22:['التحدي الأخير',m(1,3,4)+' × '+m(2,2,3),14,3,null,0,'حوّل إلى 7/4 و8/3','56/12 = 14/3 = 4⅔']};const W=[[2,1,2,5,1],[1,1,2,3,1],[2,1,4,9,2],[1,1,4,5,2],[3,1,2,7,1],[4,1,2,9,1]];function stars(){return Object.values(answers).filter(Boolean).length+Object.values(wins).filter(Boolean).length}function keys(){return Math.min(5,Math.floor(stars()/2))}function reward(ok){if(ok){if(mode)points[team]=(points[team]||0)+100;for(let i=0;i<30;i++){let x=document.createElement('span');x.className='conf';x.textContent='★';x.style.cssText=`left:${Math.random()*100}%;color:${['#f1b532','#38a881','#e87886','#629fe0'][i%4]};font-size:24px;animation-delay:${i%5*.08}s`;document.body.append(x);setTimeout(()=>x.remove(),2000)}}if(sound)try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?740:260;g.gain.value=.06;o.start();o.stop(a.currentTime+.2);o.onended=()=>a.close()}catch(e){}}function go(n){page=Math.max(0,Math.min(24,n));render()}function check(choice){let q=Q[page],ok;if(choice!==undefined)ok=choice===q[5];else{let a=$('n').value,b=$('d').value;if(!a||!b||+b<=0||!Number.isInteger(+a)||!Number.isInteger(+b)){ $('feedback').textContent='أدخل بسطًا ومقامًا صحيحين';return}ok=+a*q[3]===+b*q[2]}if(answers[page]===true)return;if(ok)reward(true);else reward(false);answers[page]=ok;render()}function quiz(q){return `<h2>${q[0]}</h2>${card(eq(q[1]))}${q[4]?`<div class="grid">${q[4].map((x,i)=>btn(x,`check(${i})`)).join('')}</div>`:`<div dir="ltr"><input id="n" type="number" placeholder="البسط" style="width:110px"> / <input id="d" type="number" placeholder="المقام" style="width:110px"> ${btn('تحقق','check()')}</div><p>للعدد الصحيح اكتب المقام 1</p>`}${btn('💡 تلميح',`$('feedback').textContent=Q[page][6]`)}<p id="feedback" class="${answers[page]===true?'good':answers[page]===false?'bad':''}">${answers[page]===true?'✓ أحسنت! '+q[7]:answers[page]===false?'حاول مجددًا! '+q[7]:''}</p>`}function pizza(){return `<svg viewBox="0 0 220 220" width="240">${parts.map((v,i)=>{let a=i*Math.PI/4,b=a+Math.PI/4;return `<path onclick="parts[${i}]=!parts[${i}];render()" style="cursor:pointer" d="M110 110 L${110+100*Math.cos(a)} ${110+100*Math.sin(a)} A100 100 0 0 1 ${110+100*Math.cos(b)} ${110+100*Math.sin(b)} Z" fill="${v?'#ffc65d':'#e1dac8'}" stroke="#a46c35" stroke-width="3"/>`}).join('')}</svg>`}function win(k,ok){if(ok&&!wins[k]){wins[k]=true;reward(true)}render();$('feedback').textContent=ok?'⭐ ممتاز! إجابة صحيحة':'حاول مرة أخرى'}function render(){let c='',q=Q[page];if(q)c=quiz(q);else switch(page){case 0:c=`<svg width="150" height="145" viewBox="0 0 160 150"><ellipse cx="80" cy="141" rx="52" ry="6" fill="#244f5515"/><path d="M39 66Q9 50 13 90L40 116M121 65Q150 37 150 57L128 105" fill="#8bd8c0" stroke="#194f54" stroke-width="3"/><rect x="38" y="27" width="85" height="104" rx="24" fill="#8bd8c0" stroke="#194f54" stroke-width="3"/><path d="M80 27V12" stroke="#194f54" stroke-width="3"/><circle cx="80" cy="10" r="8" fill="#ffd36b"/><rect x="47" y="41" width="67" height="48" rx="18" fill="#fffdf3"/><circle cx="64" cy="60" r="6" fill="#194f54"/><circle cx="98" cy="60" r="6" fill="#194f54"/><path d="M68 74Q81 87 94 74" fill="none" stroke="#194f54" stroke-width="3" stroke-linecap="round"/><circle cx="55" cy="74" r="5" fill="#ef9ea3"/><circle cx="106" cy="74" r="5" fill="#ef9ea3"/><rect x="62" y="99" width="37" height="21" rx="6" fill="#ffd36b"/><text x="80" y="116" fill="#194f54" text-anchor="middle" font-size="23">×</text><path d="M57 131V141H42M105 131V141H121" stroke="#194f54" stroke-width="5" stroke-linecap="round"/></svg><h1>أبطال الكسور<br><span style="color:#bd812b">والكنز المفقود</span></h1><div class="tag" style="font-size:clamp(20px,3vw,32px);font-weight:bold;color:#164e63;border:2px solid #e5bf65;box-shadow:0 4px 0 #e5bf6540">إعداد الطالبة: جنى</div><p>مرحبًا! أنا الروبوت كَسور.<br>ساعدني في اكتشاف مفاتيح الكنز الخمسة!</p><div class="grid">${btn("👤 مغامرة فردية","mode=false;render()")}${btn("👥 منافسة صفية","mode=true;render()")}</div>${btn('ابدأ المغام let touchStart=null;document.querySelector('main').addEventListener('touchstart',e=>{if(e.target.closest('button,input,select,textarea,canvas,svg'))return;touchStart=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});document.querySelector('main').addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart[0],dy=e.changedTouches[0].clientY-touchStart[1];touchStart=null;if(Math.abs(dx)>75&&Math.abs(dx)>2*Math.abs(dy))go(page+(dx<0?1:-1))},{passive:true});
</script></html>
